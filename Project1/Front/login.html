<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>finance — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth is-active" id="page-login">
  <div class="auth__wrap">
    <div class="auth__promo">
      <div class="logo">finance</div>
      <div class="auth__illus"><span>illustration</span></div>
      <h2>Keep track of your money and save for your future</h2>
      <p>Personal finance app puts you in control of your spending. Track transactions, set budgets, and add to savings pots easily.</p>
    </div>
    <div class="auth__form">
      <h1>Login</h1>
      <div class="field"><label>Email</label><input type="email"></div>
      <div class="field field--pw"><label>Password</label><input type="password" value="password"><button class="pw-toggle" data-pw><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <a href="overview.html" class="btn btn--dark btn--block" style="margin-top:24px;text-align:center;text-decoration:none">Login</a>
      <div class="auth__switch">Need to create an account?<a href="signup.html" class="auth__link">Sign Up</a></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
