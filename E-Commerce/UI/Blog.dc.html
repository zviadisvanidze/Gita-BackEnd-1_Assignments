<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style> body { margin: 0; background: #fff; } </style>
</helmet>

<div style="font-family: 'Poppins', sans-serif; color: #1c1c1a;">
  <dc-import name="Header" active="Blog" hint-size="100%,60px"></dc-import>

  <div style="position: relative;">
    <image-slot id="blog-hero" shape="rect" placeholder="Wide interior photo" style="width: 100%; height: {{ heroHeight }};"></image-slot>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(255,255,255,0.35);">
      <div style="font-size: 12px; color: #6f6c66; margin-bottom: 8px;">Home / Blog</div>
      <div style="font-size: {{ heroTitleSize }}; font-weight: 300;">Our Blog</div>
      <div style="font-size: 14px; color: #6f6c66; margin-top: 8px;">Home ideas and design inspiration</div>
    </div>
  </div>

  <div style="padding: {{ pad }}; max-width: 1280px; margin: 0 auto;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; gap: 24px; font-size: 14px;">
        <span style="font-weight: 600; border-bottom: 2px solid #1c1c1a; padding-bottom: 6px;">All Blog</span>
        <span style="color: #8a8781;">Featured</span>
      </div>
      <div style="font-size: 13px; color: #6f6c66;">Sort by ⌄</div>
    </div>

    <div style="display: grid; grid-template-columns: {{ gridCols }}; gap: {{ gridGap }};">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="9">
        <a href="#" style="text-decoration: none; color: inherit;">
          <image-slot id="{{ p.slotId }}" shape="rounded" radius="10" placeholder="{{ p.placeholder }}" style="width: 100%; height: 180px;"></image-slot>
          <div style="margin-top: 14px; font-size: 15px; font-weight: 500; line-height: 1.4;">{{ p.title }}</div>
          <div style="font-size: 12px; color: #8a8781; margin-top: 6px;">{{ p.date }}</div>
        </a>
      </sc-for>
    </div>

    <div style="text-align: center; margin-top: 40px;">
      <button style="background: #fff; border: 1px solid #1c1c1a; color: #1c1c1a; padding: 12px 30px; border-radius: 6px; font-size: 13px; cursor: pointer;">Show more</button>
    </div>
  </div>

  <div style="padding: {{ pad }}; background: #f6f4ef; margin-top: 20px;">
    <div style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: {{ newsletterCols }}; gap: 24px; align-items: center;">
      <image-slot id="newsletter-img" shape="rounded" radius="12" placeholder="Cozy home corner" style="width: 100%; height: 160px;"></image-slot>
      <div>
        <h3 style="font-size: 26px; font-weight: 500; margin: 0 0 8px;">Join Our Newsletter</h3>
        <p style="color: #6f6c66; font-size: 13px; margin: 0 0 16px;">Sign up for deals, new products and promotions.</p>
        <div style="display: flex; gap: 10px; max-width: 380px;">
          <input placeholder="Email address" style="flex: 1; padding: 12px 14px; border: 1px solid #e2dfd7; border-radius: 6px; font-family: inherit; font-size: 13px;"></input>
          <button style="background: #1c1c1a; color: #fff; border: none; padding: 12px 22px; border-radius: 6px; font-size: 13px; cursor: pointer;">Sign up</button>
        </div>
      </div>
    </div>
  </div>

  <footer style="background: #1c1c1a; color: #fff; padding: 40px {{ padSide }} 20px;">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; padding-bottom: 24px; border-bottom: 1px solid #34322d;">
      <div>
        <div style="font-size: 18px; font-weight: 600; margin-bottom: 6px;">Loam &amp; Co.</div>
        <div style="font-size: 12px; color: #a8a49a;">Gift &amp; Decoration Store</div>
      </div>
      <div style="display: flex; gap: 32px; font-size: 13px; color: #cfcbc1;">
        <a href="Home.dc.html" style="color: inherit; text-decoration: none;">Home</a>
        <a href="Home.dc.html#shop" style="color: inherit; text-decoration: none;">Shop</a>
        <a href="Blog.dc.html" style="color: inherit; text-decoration: none;">Blog</a>
        <a href="ContactUs.dc.html" style="color: inherit; text-decoration: none;">Contact Us</a>
      </div>
    </div>
    <div style="max-width: 1280px; margin: 0 auto; padding-top: 16px; font-size: 11px; color: #8a8781;">© 2026 Loam &amp; Co. All rights reserved.</div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isMobile: false };
  componentDidMount() {
    this._onResize = () => this.setState({ isMobile: window.innerWidth < 860 });
    window.addEventListener('resize', this._onResize);
    this._onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }

  renderVals() {
    const m = this.state.isMobile;
    const topics = [
      ['7 ways to decor your home like a professional', 'Living room photo'],
      ['Inside a beautiful kitchen organization', 'Kitchen photo'],
      ['Decor your bedroom for your children', 'Bedroom photo'],
      ['Modern home is beautiful and kid-friendly', 'Living room photo'],
      ['Modern home is beautiful and kid-friendly', 'Dark accent room photo'],
      ['Modern home is beautiful and kid-friendly', 'Round mirror photo'],
      ['Modern home is beautiful and kid-friendly', 'Bright living room photo'],
      ['Modern home is beautiful and kid-friendly', 'Wood table photo'],
      ['Modern home is beautiful and kid-friendly', 'Green plants photo']
    ];
    const dates = ['July 12, 2026','July 5, 2026','June 28, 2026','June 15, 2026','June 3, 2026','May 22, 2026','May 10, 2026','April 27, 2026','April 14, 2026'];
    return {
      pad: m ? '28px 20px' : '48px 40px',
      padSide: m ? '20px' : '40px',
      heroHeight: m ? '220px' : '340px',
      heroTitleSize: m ? '32px' : '46px',
      gridCols: m ? 'minmax(0,1fr) minmax(0,1fr)' : 'repeat(3, minmax(0,1fr))',
      gridGap: m ? '16px' : '28px',
      newsletterCols: m ? '1fr' : 'minmax(0,1fr) minmax(0,1.4fr)',
      posts: topics.map((t, i) => ({ title: t[0], placeholder: t[1], date: dates[i], slotId: 'blog-post-' + i }))
    };
  }
}

</script>
</body>
</html>
